#:schema https://supabase.com/schemas/config/v1.json

# Local CLI project identifier. Remote association is maintained by the Supabase CLI.
project_id = "simplelife"

[db]
major_version = 17

[db.migrations]
schema_paths = []

# Require a valid Supabase user JWT before the function handler runs.
[functions.agenda-time-resolve]
verify_jwt = true

[functions.agenda-event-create]
verify_jwt = true

[functions.agenda-event-mutate]
verify_jwt = true

[functions.agenda-protected-time-mutate]
verify_jwt = true

# User-authenticated queue entry point.
[functions.inbox-processing-queue]
verify_jwt = true

# Internal worker; @supabase/server validates the secret apikey header.
[functions.inbox-processing-worker]
verify_jwt = false
