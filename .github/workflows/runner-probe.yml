name: SimpleLife Runner Allocation Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runner-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Confirm GitHub-hosted runner allocation
        run: |
          echo "SIMPLELIFE_RUNNER_PROBE=PASS"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
          node --version
