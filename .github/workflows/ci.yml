name: SimpleLife CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: simplelife-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether an npm lockfile already exists
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the pinned npm dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Save the initial lockfile to main
        if: github.event_name == 'push' && steps.lockfile.outputs.missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm dependency lockfile"
          git push origin HEAD:main

      - name: Install exactly the locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run browser smoke and mobile layout tests
        run: npm run test:e2e

      - name: Validate opt-in live smoke suite without connecting to Supabase
        run: npm run test:e2e:live -- --list

      - name: Set up pinned Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
          cache: true

      - name: Resolve and commit the exact Deno dependency graph
        run: |
          deno install --config supabase/functions/agenda-time-resolve/deno.json --frozen-lockfile --entrypoint supabase/functions/agenda-time-resolve/index.ts tests/agenda-iana-resolver.deno.ts

      - name: Test and type-check Agenda IANA resolver with frozen lockfile
        run: |
          deno test --config supabase/functions/agenda-time-resolve/deno.json --frozen-lockfile tests/agenda-iana-resolver.deno.ts
          deno check --config supabase/functions/agenda-time-resolve/deno.json --frozen-lockfile supabase/functions/agenda-time-resolve/index.ts
          cat deno.lock

      - name: Build production assets
        run: npm run build

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simplelife-playwright-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
