name: SimpleLife CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: simplelife-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether an npm lockfile already exists
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate the pinned npm dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Save the initial lockfile to main
        if: github.event_name == 'push' && steps.lockfile.outputs.missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm dependency lockfile"
          git push origin HEAD:main

      - name: Install exactly the locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run browser smoke and mobile layout tests
        run: npm run test:e2e

      - name: Validate opt-in live smoke suite without connecting to Supabase
        run: npm run test:e2e:live -- --list

      - name: Set up pinned Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
          cache: true

      - name: Verify the pinned Deno dependency graph
        run: |
          deno install --config supabase/functions/agenda-time-resolve/deno.json --frozen-lockfile --entrypoint supabase/functions/agenda-time-resolve/index.ts --entrypoint supabase/functions/agenda-event-create/index.ts --entrypoint supabase/functions/agenda-event-mutate/index.ts tests/agenda-iana-resolver.deno.ts tests/agenda-time-resolve.http.deno.ts tests/agenda-timezone-auth.deno.ts tests/agenda-event-profile.deno.ts tests/agenda-event-idempotency.deno.ts tests/agenda-event-create.deno.ts tests/agenda-event-mutation.deno.ts

      - name: Test and type-check Agenda IANA resolver with frozen lockfile
        run: |
          deno test --config supabase/functions/agenda-time-resolve/deno.json --frozen-lockfile tests/agenda-iana-resolver.deno.ts tests/agenda-time-resolve.http.deno.ts tests/agenda-event-profile.deno.ts tests/agenda-event-idempotency.deno.ts tests/agenda-event-create.deno.ts tests/agenda-event-mutation.deno.ts
          APPVEYOR=simplelife-auth-test AI_AGENT=simplelife-auth-test CI=1 NODE_ENV=test deno test --allow-env=APPVEYOR,AI_AGENT,CI,DEBUG,NODE_ENV,MODE,MINIMAL,NO_COLOR,FORCE_COLOR,TERM,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEYS,SUPABASE_SECRET_KEYS,SUPABASE_JWKS --config supabase/functions/agenda-time-resolve/deno.json --frozen-lockfile tests/agenda-timezone-auth.deno.ts
          deno check --config supabase/functions/agenda-time-resolve/deno.json --frozen-lockfile supabase/functions/agenda-time-resolve/index.ts supabase/functions/agenda-event-create/index.ts supabase/functions/agenda-event-mutate/index.ts

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Start full local Supabase stack without applying migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          config = path.read_text()
          marker = "[db.migrations]\nschema_paths = []"
          if marker not in config:
              raise SystemExit("Expected [db.migrations] config block was not found")
          path.write_text(config.replace(marker, "[db.migrations]\nenabled = false\nschema_paths = []", 1))
          PY
          supabase start

      - name: Reproduce hosted RLS bootstrap in ephemeral local Postgres
        run: docker exec -i supabase_db_simplelife psql -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/sql/local-supabase-bootstrap.sql

      - name: Apply local migrations after platform bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          config = path.read_text()
          marker = "[db.migrations]\nenabled = false\nschema_paths = []"
          if marker not in config:
              raise SystemExit("Expected temporary migrations-disabled config was not found")
          path.write_text(config.replace(marker, "[db.migrations]\nenabled = true\nschema_paths = []", 1))
          PY
          supabase migration up

      - name: Test Event persistence and append-only audit invariants in ephemeral local Postgres
        run: docker exec -i supabase_db_simplelife psql -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/sql/agenda-event-persistence.test.sql

      - name: Test Event create idempotency ledger and atomic routine in ephemeral local Postgres
        run: docker exec -i supabase_db_simplelife psql -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/sql/agenda-event-idempotency.test.sql

      - name: Test Event mutation ledger, optimistic concurrency and lifecycle in ephemeral local Postgres
        run: docker exec -i supabase_db_simplelife psql -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/sql/agenda-event-mutation.test.sql

      - name: Test concurrent Event create idempotency claims in ephemeral local Postgres
        run: node scripts/agenda-event-idempotency-concurrency-smoke.mjs

      - name: Verify Agenda auth in the actual local Edge Runtime
        run: node scripts/agenda-edge-runtime-smoke.mjs

      - name: Verify Event Create JWT gate in the actual local Edge Runtime
        run: node scripts/agenda-event-create-edge-smoke.mjs

      - name: Verify Event mutation lifecycle in the actual local Edge Runtime
        run: node scripts/agenda-event-mutate-edge-smoke.mjs

      - name: Stop local Supabase stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            if ! timeout 90s supabase stop --no-backup; then
              docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f || true
            fi
          fi

      - name: Restore tracked Supabase config after temporary CI override
        if: always()
        run: git checkout -- supabase/config.toml

      - name: Build production assets
        run: npm run build

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simplelife-playwright-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
